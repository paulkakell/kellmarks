name: Apply Kellmarks 02.00.00

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: kellmarks-release-02-00-00
  cancel-in-progress: false

jobs:
  tests:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate and unpack release payload
        run: python .release/unpack.py
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            docs/server/requirements.lock
      - name: Install dependencies in a fresh environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Compile Python
        run: python -m compileall -q docs/server tests scripts
      - name: Validate JavaScript syntax
        run: node --check docs/assets/app.js
      - name: Run unit, integration, and regression tests
        env:
          KELLMARKS_DATA_FILE: ${{ runner.temp }}/kellmarks-release-data-${{ matrix.python-version }}.json
        run: python -m pytest

  quality-security-build:
    name: Quality, security, dependencies, and clean build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate and unpack release payload
        run: python .release/unpack.py
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            docs/server/requirements.lock
      - name: Install dependencies in a fresh environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Static analysis and linting
        run: |
          ruff check . --exclude .release
          mypy
      - name: SAST and secret pattern scan
        run: |
          bandit -r docs/server -ll -x docs/server/instance
          python scripts/scan_secrets.py
      - name: Dependency vulnerability audit
        run: pip-audit --no-deps -r docs/server/requirements.lock
      - name: Release and configuration validation
        run: python scripts/validate_release.py
      - name: Performance regression check
        env:
          KELLMARKS_DATA_FILE: ${{ runner.temp }}/kellmarks-release-benchmark.json
        run: python scripts/benchmark.py
      - name: Server smoke test
        env:
          KELLMARKS_DATA_FILE: ${{ runner.temp }}/kellmarks-release-smoke.json
        run: |
          python docs/server/app.py >"${RUNNER_TEMP}/kellmarks-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health >"${RUNNER_TEMP}/health.json"; then
              break
            fi
            sleep 0.5
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          health_path = Path(os.environ["RUNNER_TEMP"]) / "health.json"
          if not health_path.is_file():
              raise SystemExit("server health check did not produce a response")
          health = json.loads(health_path.read_text(encoding="utf-8"))
          assert health["ok"] is True
          assert health["version"] == "02.00.00"
          assert health["dataSchemaVersion"] == 2
          PY

  codeql:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate and unpack release payload
        run: python .release/unpack.py
      - uses: github/codeql-action/init@cc290b166002839ef66cbe0740fabefad66fca5b # v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@cc290b166002839ef66cbe0740fabefad66fca5b # v4
      - uses: github/codeql-action/analyze@cc290b166002839ef66cbe0740fabefad66fca5b # v4
        with:
          category: /language:${{ matrix.language }}/release-bootstrap

  publish:
    name: Create validated release commit object
    needs: [tests, quality-security-build, codeql]
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Validate and unpack release payload
        run: python .release/unpack.py
      - name: Revalidate release structure
        run: python scripts/validate_release.py
      - name: Stage the explicit release scope
        run: |
          cp .release/publish_commit.py "${RUNNER_TEMP}/publish_commit.py"
          rm -rf .release .github/workflows/apply-release.yml
          git add -- \
            .env.example \
            .github/CODEOWNERS \
            .github/dependabot.yml \
            .github/workflows/ci.yml \
            .github/workflows/codeql.yml \
            .gitignore \
            CHANGELOG.md \
            CONTRIBUTING.md \
            Makefile \
            README.md \
            SECURITY.md \
            VERSION \
            docs \
            pyproject.toml \
            requirements-dev.txt \
            scripts \
            tests
          git add -u -- .release .github/workflows/apply-release.yml
          git diff --cached --check
          git status --short
      - name: Create release commit through the Git database API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: harden Kellmarks 02.00.00" \
            -m "Resolve SEC-001 through SEC-006 with protected APIs, private atomic storage, strict validation, bounded resources, pinned dependencies, automated tests, SAST, dependency auditing, migration guidance, rollback guidance, and release documentation."
          python "${RUNNER_TEMP}/publish_commit.py"
