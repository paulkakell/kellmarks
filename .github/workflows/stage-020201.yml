name: Stage verified 02.02.01 source objects

on:
  push:
    branches: [fix/02.02.01-release-downloads]
    paths: [.github/workflows/stage-020201.yml]

permissions:
  contents: write

jobs:
  stage:
    if: github.repository == 'paulkakell/kellmarks'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify and stage source objects without executing patched code or moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/02.02.01-release-downloads
          cat .github/asset-fix.patch.gz.0 .github/asset-fix.patch.gz.1 .github/asset-fix.patch.gz.2 > "$RUNNER_TEMP/fix.patch.gz"
          printf '%s  %s\n' 38f9eac31807a4668860ae8d26d07b9f5177fd12e56b00cc5508ef36d4985f7f "$RUNNER_TEMP/fix.patch.gz" | sha256sum --check -
          gzip -dc "$RUNNER_TEMP/fix.patch.gz" > "$RUNNER_TEMP/fix.patch"
          git apply --index --unidiff-zero --whitespace=error-all "$RUNNER_TEMP/fix.patch"
          git rm .github/asset-fix.patch.gz.0 .github/asset-fix.patch.gz.1 .github/asset-fix.patch.gz.2 .github/workflows/stage-020201.yml
          test "$(git write-tree)" = acd75b15842af8ba09860fb600b8a56304efca14
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          from pathlib import Path
          def post(endpoint, body):
              response = subprocess.run(['gh', 'api', '--method', 'POST', endpoint, '--input', '-'], input=json.dumps(body), text=True, capture_output=True, check=True, timeout=60)
              return json.loads(response.stdout)
          repository = os.environ['GITHUB_REPOSITORY']
          assert repository == 'paulkakell/kellmarks'
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--diff-filter=AM'], text=True).splitlines()
          entries = []
          for name in paths:
              path = Path(name)
              assert path.is_file() and not path.is_symlink() and '..' not in path.parts
              blob = post(f'repos/{repository}/git/blobs', {'content': base64.b64encode(path.read_bytes()).decode(), 'encoding': 'base64'})
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = post(f'repos/{repository}/git/trees', {'base_tree': '8d939a7f0157cb0a0e3f86ee53a363ff4b03cf0d', 'tree': entries})
          assert tree['sha'] == 'acd75b15842af8ba09860fb600b8a56304efca14', tree['sha']
          print('Verified staged source tree:', tree['sha'])
          PY
