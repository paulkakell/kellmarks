name: Apply verified GHCR source update

on:
  push:
    branches: [feature/02.02.00-ghcr-compose]
    paths: [.github/workflows/apply-ghcr-update.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'paulkakell/kellmarks'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply checksum-verified patch without executing its code
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feature/02.02.00-ghcr-compose
          test "$(git rev-parse HEAD^)" = 7ac1982219fe023de308b4ad4171c47b7a0f33c9
          cat .github/ghcr-update.patch.gz.00 .github/ghcr-update.patch.gz.01 .github/ghcr-update.patch.gz.02 .github/ghcr-update.patch.gz.03 .github/ghcr-update.patch.gz.04 .github/ghcr-update.patch.gz.05 > "$RUNNER_TEMP/ghcr-update.patch.gz"
          printf '%s  %s\n' '7feb7ee544e4d3f8a88bdec31a3478bba95bb6b9dd19738eaf184af102b27e5c' "$RUNNER_TEMP/ghcr-update.patch.gz" | sha256sum --check -
          gzip -dc "$RUNNER_TEMP/ghcr-update.patch.gz" > "$RUNNER_TEMP/ghcr-update.patch"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/ghcr-update.patch"
          git rm .github/ghcr-update.patch.gz.00 .github/ghcr-update.patch.gz.01 .github/ghcr-update.patch.gz.02 .github/ghcr-update.patch.gz.03 .github/ghcr-update.patch.gz.04 .github/ghcr-update.patch.gz.05 .github/workflows/apply-ghcr-update.yml
          git diff --cached --check
          test "$(git write-tree)" = b593fc4f593116360c3b1f3d0e4c8b5969b1630a
          test "$(cat VERSION)" = 02.02.00
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(02.02.00): add GHCR images and pull-only Compose installation' -m 'Add docker-compose.yml, AMD64/ARM64 GHCR publication gated by full application and Docker tests, immutable version/revision checks, explicit installation assets and complete setup/operations documentation. Preserve source builds, authentication, private volumes and schema 2. Local validation: 201 Python tests, seven JavaScript tests, 91.25% server coverage, lint, types, SAST, secret checks and performance budgets. Browser/container/dependency-network checks require GitHub CI. Source tree verified against b593fc4f593116360c3b1f3d0e4c8b5969b1630a; transfer checksum verified before git apply. Remove temporary transfer workflow and blobs. Related: #13; base: 7ac1982219fe023de308b4ad4171c47b7a0f33c9.'
          git push origin HEAD:refs/heads/feature/02.02.00-ghcr-compose
