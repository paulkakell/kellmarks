name: Prepare Kellmarks 02.00.02 version badges

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kellmarks-version-badges-02-00-02
  cancel-in-progress: false

jobs:
  prepare:
    name: Build, validate, and publish 02.00.02
    if: ${{ github.ref == 'refs/heads/dev' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Apply traceable 02.00.02 badge release
        run: python scripts/release_020002.py

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            docs/server/requirements.lock

      - name: Install dependencies in a fresh environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile Python and validate JavaScript syntax
        run: |
          python -m compileall -q docs/server tests scripts
          node --check docs/assets/app.js

      - name: Run unit, integration, and regression tests
        env:
          KELLMARKS_DATA_FILE: ${{ runner.temp }}/kellmarks-badges-tests.json
        run: python -m pytest

      - name: Run static analysis and linting
        run: |
          ruff check .
          mypy

      - name: Run security and dependency review
        run: |
          bandit -r docs/server -ll -x docs/server/instance
          python scripts/scan_secrets.py
          pip-audit --no-deps -r docs/server/requirements.lock

      - name: Validate release, configuration, and performance
        env:
          KELLMARKS_DATA_FILE: ${{ runner.temp }}/kellmarks-badges-benchmark.json
        run: |
          python scripts/validate_release.py
          python scripts/benchmark.py

      - name: Run live server smoke test
        env:
          KELLMARKS_DATA_FILE: ${{ runner.temp }}/kellmarks-badges-smoke.json
        run: |
          python docs/server/app.py >"${RUNNER_TEMP}/kellmarks-badges-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health >"${RUNNER_TEMP}/badges-health.json"; then
              break
            fi
            sleep 0.5
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          health_path = Path(os.environ["RUNNER_TEMP"]) / "badges-health.json"
          if not health_path.is_file():
              raise SystemExit("server health check did not produce a response")
          health = json.loads(health_path.read_text(encoding="utf-8"))
          expected_version = Path("VERSION").read_text(encoding="utf-8").strip()
          assert health["ok"] is True
          assert health["version"] == expected_version
          assert health["dataSchemaVersion"] == 2
          PY

      - name: Commit validated 02.00.02 release to dev
        run: |
          git diff --check
          git add -- VERSION CHANGELOG.md README.md SECURITY.md docs scripts/validate_release.py tests/test_release_metadata.py
          if git diff --cached --name-only | grep -q '^\.github/'; then
            echo "workflow files must not be changed by the release publisher" >&2
            exit 1
          fi
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(release): align Kellmarks 02.00.02 version badges" \
            -m "Add release, runtime, schema, CI, CodeQL, and in-app version badges; align release metadata; add guarded release publication; and retain SEC-001 through SEC-006 without runtime or schema changes."
          git push origin HEAD:dev
