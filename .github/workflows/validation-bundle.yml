name: Validation bundle

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Versioned source and offline validation inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Package tracked source and validation dependencies
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]]
          revision="$(git rev-parse HEAD)"
          destination="${RUNNER_TEMP}/kellmarks-validation"
          mkdir -p "$destination/wheels"
          git archive --format=tar.gz --prefix=kellmarks/ HEAD > "$destination/source.tar.gz"
          python -m pip download --only-binary=:all: -r requirements-dev.txt -r requirements-browser.txt --dest "$destination/wheels"
          printf 'version=%s\ncommit=%s\npython=3.13\nplatform=linux-x86_64\n' "$version" "$revision" > "$destination/PROVENANCE.txt"
          (cd "$destination" && sha256sum source.tar.gz wheels/* > SHA256SUMS)
          echo "name=kellmarks-${version}-${revision}-validation" >> "$GITHUB_OUTPUT"
          echo "path=${destination}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ steps.bundle.outputs.path }}
          retention-days: 3
          if-no-files-found: error
