name: Repair failed PR release 02.00.01

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kellmarks-release-repair-02-00-01
  cancel-in-progress: false

jobs:
  repair:
    name: Build, validate, and publish 02.00.01
    if: github.ref == 'refs/heads/dev' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Apply traceable 02.00.01 release repair
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          ROOT = Path.cwd()
          OLD = "02.00.00"
          NEW = "02.00.01"


          def read(relative: str) -> str:
              return (ROOT / relative).read_text(encoding="utf-8")


          def write(relative: str, content: str) -> None:
              path = ROOT / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")


          def replace_once(relative: str, old: str, new: str) -> None:
              content = read(relative)
              if content.count(old) != 1:
                  raise SystemExit(
                      f"expected one release marker in {relative}, found {content.count(old)}"
                  )
              write(relative, content.replace(old, new, 1))


          def replace_all(relative: str, old: str, new: str) -> None:
              content = read(relative)
              if old not in content:
                  raise SystemExit(f"release marker missing in {relative}")
              write(relative, content.replace(old, new))


          current = read("VERSION").strip()
          if current != OLD:
              raise SystemExit(f"expected VERSION {OLD}, found {current}")
          write("VERSION", f"{NEW}\n")

          replace_once(
              "docs/server/app.py",
              f'APP_VERSION = "{OLD}"',
              f'APP_VERSION = "{NEW}"',
          )
          replace_once(
              "docs/assets/app.js",
              f'const APP_VERSION = "{OLD}";',
              f'const APP_VERSION = "{NEW}";',
          )
          replace_all("docs/openapi.yaml", f'"{OLD}"', f'"{NEW}"')
          replace_all("docs/API.md", OLD, NEW)
          replace_once("README.md", f"Version: **{OLD}**", f"Version: **{NEW}**")
          replace_once(
              "docs/server/README.md",
              f"# Kellmarks server {OLD}",
              f"# Kellmarks server {NEW}",
          )
          replace_once(
              "SECURITY.md",
              f"| {OLD} | Yes |",
              f"| {NEW} | Yes |\n| {OLD} | Yes |",
          )
          replace_once(
              "docs/SECURITY_ARCHITECTURE.md",
              f"Kellmarks {OLD} is designed",
              f"Kellmarks {NEW} is designed",
          )
          replace_once(
              "docs/server/requirements.lock",
              f"# Runtime dependency lock for Kellmarks {OLD}.",
              f"# Runtime dependency lock for Kellmarks {NEW}.",
          )
          replace_all("scripts/validate_release.py", OLD, NEW)

          changelog = read("CHANGELOG.md")
          marker = f"## [{OLD}]"
          if marker not in changelog:
              raise SystemExit("02.00.00 changelog marker is missing")
          section = f"""## [{NEW}] - 2026-08-13

### Fixed

- **PR #1 / CI-001:** Recovered the exact 02.00.00 tree that passed tests, linting, typing, SAST, dependency auditing, CodeQL, configuration checks, performance checks, and the server smoke test. The prior publisher left only temporary payload files on `dev` after GitHub rejected a workflow-file push.
- **CI-002:** Replaced invalid or stale GitHub Action references with verified, immutable commits for `actions/checkout` v5, `actions/setup-python` v6, and `github/codeql-action` v4.
- **CI-003:** Changed the smoke test to derive its expected application version from `VERSION`, removing a release-specific workflow constant.
- **REL-001:** Removed temporary payload, unpacker, and publisher artifacts from the release tree.

### Added

- Added release-metadata regression tests covering version alignment, immutable workflow pins, and the absence of bootstrap artifacts.
- Added release notes, rollback instructions, and copy-ready commit notes for the publication repair.

### Compatibility

This is a non-breaking publication and CI fix. API paths, authentication behavior, configuration fields, data schema 2, dependency versions, and bookmark data formats are unchanged from 02.00.00.

"""
          write("CHANGELOG.md", changelog.replace(marker, section + marker, 1))

          release_notes = f"""# Kellmarks {NEW}

## Release classification

Bug-fix release. Non-breaking.

## Why this release exists

PR #1 failed because the `dev` branch contained a temporary release publisher rather than the application tree that had already passed the complete 02.00.00 validation gate. CI therefore could not find its dependency and project files, while CodeQL referenced an invalid action commit.

This release restores the validated application tree and makes the publication process traceable without changing runtime behavior.

## Changes

- Recovered validated source commit `4a4f42da1d0013bd3b134ea29e44addb262f1dda` and made it reachable from `dev`.
- Replaced temporary `.release` payloads and publisher workflows with the permanent application tree.
- Pinned `actions/checkout` v5 to `fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09`.
- Pinned `actions/setup-python` v6 to `ece7cb06caefa5fff74198d8649806c4678c61a1`.
- Pinned `github/codeql-action` v4 to `ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd`.
- Made CI smoke validation read the expected version from `VERSION`.
- Added regression coverage for release metadata and bootstrap-file removal.

Issue references: PR #1, CI-001, CI-002, CI-003, REL-001. Security controls from SEC-001 through SEC-006 are retained unchanged.

## Validation

The release workflow runs the complete suite before publishing:

- unit, integration, regression, migration, configuration, concurrency, security, observability, store, API, and external-search tests;
- branch coverage with an 85 percent minimum;
- Python compilation and JavaScript syntax validation;
- Ruff and mypy;
- Bandit and the repository secret-pattern scanner;
- `pip check` and `pip-audit` against the pinned runtime lock;
- release and configuration validation;
- the 25,000-entry performance regression check;
- a live loopback server health smoke test.

Permanent CI and CodeQL run again after the temporary repair workflow is removed.

## Security review

Authentication, authorization, exact-origin CORS, Trusted Host handling, request validation, private atomic storage, rate controls, structured logging, secret handling, and bounded external requests are unchanged from 02.00.00. No secrets are added. The repaired workflows use least-privilege permissions and immutable action references.

## Dependency validation

Runtime and development dependency versions are unchanged. The existing lock files are rebuilt only when dependencies change; this release revalidates the current files with `pip check` and `pip-audit`.

## Configuration validation

No environment variable, default, feature flag, or API configuration changes are introduced. The version marker advances to {NEW}. The data schema remains 2.

## Database and migration review

No database or JSON schema migration is required. The 02.00.00 legacy migration path and `data.pre-v02.00.00.json` backup name remain unchanged intentionally.

## Performance and observability

Core search, storage, and I/O logic are unchanged. The standard benchmark and smoke test are rerun. Structured request and security logs retain their existing fields and redaction behavior.

## Backward compatibility

This release is backward compatible with 02.00.00. Endpoint paths, request and response shapes, CLI behavior, configuration names, and schema-2 data remain stable.

## Rollback plan

1. Stop the service and preserve the private data file, `.bak`, and `data.pre-v02.00.00.json` when present.
2. Restore validated commit `4a4f42da1d0013bd3b134ea29e44addb262f1dda` or the 02.00.00 deployment artifact.
3. Restore the pinned dependency environment.
4. Run `/api/health`, entry-count, import/export, and disposable CRUD checks before restoring traffic.
5. Do not roll back to the temporary publisher commits because they do not contain a deployable application tree.

## Promotion

Proposed tag after PR approval: `v{NEW}`.

## Copy-ready commit notes

```text
fix(release): publish Kellmarks {NEW}

- recover the validated 02.00.00 application tree
- remove temporary release payload and publisher artifacts
- repair CI dependency paths by restoring the complete project tree
- pin checkout v5, setup-python v6, and CodeQL v4 to verified commits
- derive smoke-test version expectations from VERSION
- add release-metadata regression tests
- rerun tests, coverage, lint, typing, SAST, secret scan, dependency audit,
  release validation, performance validation, and live server smoke testing

Classification: fix, additive tests and documentation, non-breaking
Issues: PR #1, CI-001, CI-002, CI-003, REL-001
Security inheritance: SEC-001, SEC-002, SEC-003, SEC-004, SEC-005, SEC-006
Version: {NEW}
Tag on promotion: v{NEW}
Rollback target: 4a4f42da1d0013bd3b134ea29e44addb262f1dda
```
"""
          write(f"docs/releases/{NEW}.md", release_notes)

          metadata_test = f'''from __future__ import annotations

import re
from pathlib import Path

import app as kellmarks

ROOT = Path(__file__).resolve().parents[1]
VERSION_PATTERN = re.compile(r"^\\d{{2}}\\.\\d{{2}}\\.\\d{{2}}$")
ACTION_PATTERN = re.compile(r"uses:\\s+[^@\\s]+@([0-9a-f]{{40}})(?:\\s+#.*)?$")


def read(relative: str) -> str:
    return (ROOT / relative).read_text(encoding="utf-8")


def test_release_metadata_is_aligned() -> None:
    version = read("VERSION").strip()
    assert version == "{NEW}"
    assert VERSION_PATTERN.fullmatch(version)
    assert kellmarks.APP_VERSION == version
    assert f'const APP_VERSION = "{{version}}";' in read("docs/assets/app.js")
    assert f'version: "{{version}}"' in read("docs/openapi.yaml")
    assert f"## [{{version}}]" in read("CHANGELOG.md")
    assert f"# Kellmarks {{version}}" in read(f"docs/releases/{{version}}.md")


def test_permanent_workflows_use_immutable_action_references() -> None:
    for relative in (".github/workflows/ci.yml", ".github/workflows/codeql.yml"):
        for line in read(relative).splitlines():
            if "uses:" in line:
                assert ACTION_PATTERN.search(line.strip()), line


def test_bootstrap_release_artifacts_are_absent() -> None:
    assert not (ROOT / ".release").exists()
    assert not (ROOT / ".github/workflows/apply-release.yml").exists()
    assert not (ROOT / ".github/workflows/publish-release-code.yml").exists()
'''
          write("tests/test_release_metadata.py", metadata_test)
          print(f"prepared Kellmarks {NEW} publication repair")
          PY
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            docs/server/requirements.lock
      - name: Install dependencies in a fresh environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Compile and validate syntax
        run: |
          python -m compileall -q docs/server tests scripts
          node --check docs/assets/app.js
      - name: Run unit, integration, and regression tests
        env:
          KELLMARKS_DATA_FILE: ${{ runner.temp }}/kellmarks-repair-tests.json
        run: python -m pytest
      - name: Run static analysis and linting
        run: |
          ruff check .
          mypy
      - name: Run security and dependency review
        run: |
          bandit -r docs/server -ll -x docs/server/instance
          python scripts/scan_secrets.py
          pip-audit --no-deps -r docs/server/requirements.lock
      - name: Validate release, configuration, and performance
        env:
          KELLMARKS_DATA_FILE: ${{ runner.temp }}/kellmarks-repair-benchmark.json
        run: |
          python scripts/validate_release.py
          python scripts/benchmark.py
      - name: Run live server smoke test
        env:
          KELLMARKS_DATA_FILE: ${{ runner.temp }}/kellmarks-repair-smoke.json
        run: |
          python docs/server/app.py >"${RUNNER_TEMP}/kellmarks-repair-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health >"${RUNNER_TEMP}/repair-health.json"; then
              break
            fi
            sleep 0.5
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          health_path = Path(os.environ["RUNNER_TEMP"]) / "repair-health.json"
          if not health_path.is_file():
              raise SystemExit("server health check did not produce a response")
          health = json.loads(health_path.read_text(encoding="utf-8"))
          expected_version = Path("VERSION").read_text(encoding="utf-8").strip()
          assert health["ok"] is True
          assert health["version"] == expected_version
          assert health["dataSchemaVersion"] == 2
          PY
      - name: Commit validated release repair to dev
        run: |
          git diff --check
          git add -- VERSION CHANGELOG.md README.md SECURITY.md docs scripts tests
          if git diff --cached --name-only | grep -q '^.github/'; then
            echo "workflow files must not be changed by the repair publisher" >&2
            exit 1
          fi
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(release): publish Kellmarks 02.00.01" \
            -m "Recover the validated 02.00.00 tree, remove temporary publisher artifacts, align release metadata, add regression tests, and retain SEC-001 through SEC-006 without runtime or schema changes."
          git push origin HEAD:dev
