name: Publish release

on:
  workflow_run:
    workflows: ["Security and quality"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write

concurrency:
  group: publish-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish validated version
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Validate version and release notes
        id: release
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "VERSION must use xx.xx.xx format" >&2
            exit 1
          fi
          notes="docs/releases/${version}.md"
          test -f "$notes"
          grep -Fq "# Kellmarks ${version}" "$notes"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "notes=${notes}" >> "$GITHUB_OUTPUT"

      - name: Require successful checks for the exact commit
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          import time

          repository = os.environ["GITHUB_REPOSITORY"]
          release_sha = os.environ["RELEASE_SHA"]
          required = {
              "Tests on Python 3.10",
              "Tests on Python 3.13",
              "Quality, security, dependencies, and clean build",
              "Analyze python",
              "Analyze javascript-typescript",
          }

          for attempt in range(60):
              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      f"repos/{repository}/commits/{release_sha}/check-runs?per_page=100",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              payload = json.loads(result.stdout)
              latest: dict[str, dict[str, object]] = {}
              for run in payload.get("check_runs", []):
                  if not isinstance(run, dict):
                      continue
                  name = run.get("name")
                  run_id = run.get("id")
                  if not isinstance(name, str) or not isinstance(run_id, int):
                      continue
                  current = latest.get(name)
                  if current is None or int(current["id"]) < run_id:
                      latest[name] = run

              failed = []
              waiting = []
              for name in sorted(required):
                  run = latest.get(name)
                  if run is None or run.get("status") != "completed":
                      waiting.append(name)
                      continue
                  if run.get("conclusion") != "success":
                      failed.append(f"{name}: {run.get('conclusion')}")

              if failed:
                  raise SystemExit("required checks failed: " + ", ".join(failed))
              if not waiting:
                  print(f"all required checks passed for {release_sha}")
                  break

              if attempt == 59:
                  raise SystemExit(
                      "timed out waiting for required checks: " + ", ".join(waiting)
                  )
              print("waiting for required checks: " + ", ".join(waiting))
              time.sleep(10)
          PY

      - name: Publish immutable tag and GitHub release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            existing_target="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$existing_target" != "$RELEASE_SHA" ]]; then
              echo "existing release tag targets ${existing_target}, expected ${RELEASE_SHA}" >&2
              exit 1
            fi
            echo "release ${RELEASE_TAG} already exists at ${RELEASE_SHA}"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            existing_target="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$existing_target" != "$RELEASE_SHA" ]]; then
              echo "existing tag targets ${existing_target}, expected ${RELEASE_SHA}" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Kellmarks ${RELEASE_VERSION}" \
              --notes-file "$RELEASE_NOTES" \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "Kellmarks ${RELEASE_VERSION}" \
              --notes-file "$RELEASE_NOTES" \
              --latest
          fi
