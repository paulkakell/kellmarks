openapi: 3.0.3
info:
  title: Kellmarks API
  version: "02.02.01"
  description: >-
    Protected local-first bookmark API. Loopback access may be unauthenticated only
    when the server has no configured token and the request does not traverse a proxy.
servers:
  - url: http://127.0.0.1:8787
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      summary: Local health and installed version
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/version:
    get:
      summary: Cached stable-release status
      description: >-
        Checks only the fixed public Kellmarks GitHub release endpoint. Normal API
        authentication applies. External-request denial returns disabled without
        network access. Successes are cached for one hour, failures for five minutes.
      responses:
        "200":
          description: Version status, including unavailable and disabled states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionStatus"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/entries:
    get:
      summary: List entries
      responses:
        "200":
          description: Entry array
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create an entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/entries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 80
          pattern: "^[A-Za-z0-9._:-]+$"
    get:
      summary: Get one entry
      responses:
        "200":
          description: Entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Update an entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryInput" }
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      summary: Delete an entry
      responses:
        "200":
          description: Deleted entry wrapper
          content:
            application/json:
              schema:
                type: object
                required: [deleted, entry]
                properties:
                  deleted: { type: boolean }
                  entry: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/export:
    get:
      summary: Export the complete data store
      responses:
        "200":
          description: Export object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/import/preview:
    post:
      summary: Review a merge or replacement without writing
      description: >-
        Validates JSON entries or browser bookmark HTML and the complete candidate.
        Defaults to merge. Individual invalid entries return a valid=false preview;
        invalid options, ambiguous identity or candidate limits return 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportSource" }
      responses:
        "200":
          description: Private read-only preview, valid or invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/StoreFailure" }
  /api/import:
    post:
      summary: Apply a reviewed import or a legacy replacement
      description: >-
        An explicit mode selects the guarded workflow and requires baseRevision.
        Reuse normalized incomingEntries from preview as entries. A stale library
        returns 409. Omit mode only for the unchanged legacy replacement contract.
        Successful writes preserve the previous library in a private rolling backup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - allOf:
                    - $ref: "#/components/schemas/ImportSource"
                    - required: [mode, baseRevision]
                - type: object
                  required: [entries]
                  not: { required: [mode] }
                  properties:
                    entries:
                      type: array
                      maxItems: 5000
                      items: { $ref: "#/components/schemas/ImportEntry" }
      responses:
        "200":
          description: Import committed; guarded workflow adds mode and counts
          content:
            application/json:
              schema:
                type: object
                required: [imported, backupCreated]
                properties:
                  imported: { type: integer, minimum: 0 }
                  backupCreated: { type: boolean }
                  mode: { type: string, enum: [merge, replace] }
                  added: { type: integer, minimum: 0 }
                  updated: { type: integer, minimum: 0 }
                  totalCount: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/StoreFailure" }
  /api/tags/tree:
    get:
      summary: Return the hierarchical tag tree
      responses:
        "200":
          description: Tag tree root
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagNode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/search:
    get:
      summary: Boolean search with optional tag-prefix filtering
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
        - name: path
          in: query
          required: false
          schema: { type: string, maxLength: 256, default: "__ALL__" }
      responses:
        "200":
          description: Search result
          content:
            application/json:
              schema:
                type: object
                required: [q, path, count, entries]
                properties:
                  q: { type: string }
                  path: { type: string }
                  count: { type: integer, minimum: 0 }
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/external/ddg:
    get:
      summary: Bounded DuckDuckGo Instant Answer proxy
      description: Denied before network access when KELLMARKS_EXTERNAL_REQUESTS=0.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200":
          description: Filtered external results
          content:
            application/json:
              schema:
                type: object
                required: [q, results]
                properties:
                  q: { type: string }
                  results:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      required: [url, title, snippet]
                      properties:
                        url: { type: string, format: uri, maxLength: 2048 }
                        title: { type: string, maxLength: 120 }
                        snippet: { type: string, maxLength: 280 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: External search unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Random token from KELLMARKS_AUTH_TOKEN, at least 32 characters.
  schemas:
    VersionStatus:
      type: object
      required: [currentVersion, latestVersion, status, releaseUrl, checkedAt]
      properties:
        currentVersion: { type: string, example: "02.02.01" }
        latestVersion: { type: string, nullable: true, example: "02.02.01" }
        status:
          type: string
          enum: [current, update_available, ahead, unavailable, no_release, disabled]
        releaseUrl: { type: string, format: uri }
        checkedAt: { type: string, format: date-time, nullable: true }
    ImportEntry:
      allOf:
        - $ref: "#/components/schemas/EntryInput"
        - type: object
          properties:
            id: { type: string, pattern: "^[A-Za-z0-9._:-]{1,80}$" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ImportSource:
      type: object
      description: >-
        Use entries when format is json or omitted; use html when format is html.
        mode defaults to merge for preview, but omission means legacy replacement
        on the apply endpoint. Field choices apply import-wide. Empty incoming
        descriptions never erase existing descriptions during merge.
      anyOf:
        - required: [entries]
        - required: [format, html]
      properties:
        format: { type: string, enum: [json, html], default: json }
        mode: { type: string, enum: [merge, replace] }
        titleSource: { type: string, enum: [existing, incoming], default: existing }
        descriptionSource: { type: string, enum: [existing, incoming], default: existing }
        baseRevision: { type: string, pattern: "^[0-9a-f]{64}$" }
        html: { type: string, minLength: 1 }
        entries:
          type: array
          maxItems: 5000
          items: { $ref: "#/components/schemas/ImportEntry" }
    ImportPreview:
      type: object
      required: [valid, mode, invalidCount, errors, incomingEntries]
      properties:
        valid: { type: boolean }
        mode: { type: string, enum: [merge, replace] }
        invalidCount: { type: integer, minimum: 0 }
        errors:
          type: array
          maxItems: 50
          items:
            type: object
            required: [index, error]
            properties:
              index: { type: integer, minimum: 0 }
              error: { type: string }
        baseRevision: { type: string, pattern: "^[0-9a-f]{64}$" }
        incomingEntries:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
        newCount: { type: integer, minimum: 0 }
        duplicateCount: { type: integer, minimum: 0 }
        updatedCount: { type: integer, minimum: 0 }
        unchangedCount: { type: integer, minimum: 0 }
        replacedCount: { type: integer, minimum: 0 }
        totalCount: { type: integer, minimum: 0 }
        details:
          type: array
          items:
            type: object
            required: [action, url, id]
            properties:
              action: { type: string, enum: [new, merge, unchanged] }
              url: { type: string }
              id: { type: string }
    Health:
      type: object
      required: [ok, version, dataSchemaVersion, externalRequestsAllowed, time]
      properties:
        ok: { type: boolean }
        version: { type: string, example: "02.02.01" }
        dataSchemaVersion: { type: integer, example: 2 }
        externalRequestsAllowed: { type: boolean, example: true }
        time: { type: string, format: date-time }
    EntryInput:
      type: object
      required: [url]
      properties:
        title: { type: string, maxLength: 120 }
        url: { type: string, format: uri, maxLength: 2048 }
        iconUrl: { type: string, format: uri, maxLength: 2048 }
        description: { type: string, maxLength: 600 }
        tags:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 80 }
    Entry:
      allOf:
        - $ref: "#/components/schemas/EntryInput"
        - type: object
          required: [id, title, url, tags, createdAt, updatedAt]
          properties:
            id:
              type: string
              maxLength: 80
              pattern: "^[A-Za-z0-9._:-]+$"
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Store:
      type: object
      required: [version, exportedAt, entries]
      properties:
        version: { type: integer, example: 2 }
        exportedAt: { type: string, format: date-time }
        entries:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/Entry" }
    TagNode:
      type: object
      required: [name, path, count, children]
      properties:
        name: { type: string }
        path: { type: string }
        count: { type: integer, minimum: 0 }
        children:
          type: object
          additionalProperties: { $ref: "#/components/schemas/TagNode" }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        requestId: { type: string }
  responses:
    Conflict:
      description: Library changed after preview; preview again before retrying
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StoreFailure:
      description: Persistent-store operation failed; recheck library before retrying
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid request or data
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Bearer authentication required or invalid
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Remote, host, or origin policy denied the request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: Request body exceeds the configured limit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: Content-Type must be application/json
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Configured request rate exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
